<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Kiro</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: grid;
        place-items: center;
        background: #2b2b2b;
        font-family: sans-serif;
      }
      canvas {
        background: #bfe8b0;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        touch-action: none; /* prevent scroll/zoom on tap */
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module">
      import { GameEngine } from './src/shell/GameEngine.js';

      const canvas = document.getElementById('game');
      const engine = new GameEngine({ canvas });
      engine.start();
    </script>
  </body>
</html>
